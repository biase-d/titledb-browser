name: Validate Data PR

on:
  pull_request:
    branches: [ v3 ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Validate
        id: validation
        continue-on-error: true
        env:
          # Passed through the environment, never interpolated into the script:
          # a file name is attacker-controlled text in a PR
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -o pipefail
          # Whole-repository checks run every time; findings are filtered to
          # the files this PR touches, so older problems do not block it
          node scripts/validate.mjs $CHANGED_FILES | tee validation.txt

      - name: Post or update the failure comment
        if: steps.validation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.readFileSync('validation.txt', 'utf8')
            const marker = '**Validation Failed**'
            const body = [
              marker,
              '',
              'The automatic data check found problems in this pull request. Fix them and push to this branch to re-run it.',
              '',
              '<details><summary>Errors</summary>',
              '',
              '```',
              output.replace(/```/g, "'''") || 'No output was captured.',
              '```',
              '',
              '</details>',
              '',
              '---',
              '*If you think the check itself is wrong, ping @biase-d*',
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Fail the check
        if: steps.validation.outcome == 'failure'
        run: exit 1
