<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Switch Performance">
  <title>Switch Performance</title>
  <defs>
    <linearGradient id="fv-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34343b"/>
      <stop offset="0.5" stop-color="#1b1b20"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="fv-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee2a38"/>
      <stop offset="1" stop-color="#c3121f"/>
    </linearGradient>
    <clipPath id="fv-label"><rect x="11" y="9" width="42" height="38" rx="5"/></clipPath>
  </defs>
  <!-- A chibi cartridge: nearly square, soft corners, big simple shapes that hold up at 16px -->
