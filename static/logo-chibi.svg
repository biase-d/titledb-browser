  <rect x="3.6" y="2.6" width="56.8" height="58.8" rx="12.4" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1.2"/>
  <rect x="9.6" y="7.6" width="44.8" height="40.8" rx="6.4" fill="#050506"/>
  <g clip-path="url(#fv-label)">
    <rect x="11" y="9" width="42" height="38" fill="#f6f6f3"/>
    <rect x="11" y="9" width="42" height="14" fill="url(#fv-band)"/>
    <circle cx="32" cy="35" r="8.2" fill="#d3d3dc"/>
    <circle cx="32" cy="35" r="3.6" fill="#f6f6f3"/>
  </g>
  <path d="M25.5 53.2h13L32 59.6z" fill="#fff" fill-opacity="0.22"/>
