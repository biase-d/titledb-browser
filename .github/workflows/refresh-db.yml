name: Refresh Database

# Manual only. The recurring sync is a Coolify Scheduled Task running
# `node scripts/build.js` in the app container; a second cron here would race
# it for the pipeline's advisory lock and one of the two would exit as a no-op
on:
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh Title Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Script
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: node scripts/build.js --no-cache