name: Pipeline Failover

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Run full rebuild?'
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Pipeline (Failover)
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then
            node scripts/build.js --full-rebuild
          else
            node scripts/build.js
          fi
