# Local development dependencies
#
# Only Postgres: with S3_ENDPOINT unset the storage layer falls back to the
# filesystem (./storage), so there is no need to run an object store to work on
# the app. Production points S3_* at Garage — see "Storage" in the README
#
# The previous file also ran ghcr.io/timowilhelm/local-neon-http-proxy, which
# existed purely to imitate Neon's HTTP driver. The app talks plain TCP now
services:
  postgres:
    image: postgres:17
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=main
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
